    <!-- 내장 데이터 -->
    <script src="m1_embedded_slope_rows.js"></script>
    <script>
        // =========================
        // 통합 관제 맵 (강원도 줌아웃 + 내장 데이터 기반 목록/마커)
        // =========================

        const EMBEDDED_SLOPE_ROWS = Array.isArray(window.__M1_EMBEDDED_SLOPE_ROWS__) ? window.__M1_EMBEDDED_SLOPE_ROWS__ : [];
        const SAMPLE_LIMIT = 800; // 샘플링 개수(내장 데이터 기본 800개)

        // 강원도 대략 범위 (Lat/Lng)
        const GANGWON_SW = [36.90, 127.00];
        const GANGWON_NE = [38.65, 129.45];
        const GANGWON_CENTER = [37.82, 128.20];

        // Initialize Map (Gangwon)
        const map = L.map('map', { preferCanvas: true }).setView(GANGWON_CENTER, 8);
        const GANGWON_BOUNDS = L.latLngBounds(GANGWON_SW, GANGWON_NE);
        map.fitBounds(GANGWON_BOUNDS, { padding: [20, 20] });
        // 너무 멀리 보이는 경우를 대비해 "살짝" 줌인
        map.setZoom(map.getZoom() + 1);

        // Basemap layers
        const baseTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        // Satellite basemap (Esri World Imagery)
        const satelliteTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        baseTileLayer.addTo(map);

        // Map type toggle (기본/위성)
        const mapTypeBaseBtn = document.getElementById('map-type-base-btn');
        const mapTypeSatBtn = document.getElementById('map-type-satellite-btn');

        function setMapType(type) {
            const next = type === 'satellite' ? 'satellite' : 'base';
            if (next === 'satellite') {
                if (map.hasLayer(baseTileLayer)) map.removeLayer(baseTileLayer);
                if (!map.hasLayer(satelliteTileLayer)) map.addLayer(satelliteTileLayer);

                if (mapTypeBaseBtn) {
                    mapTypeBaseBtn.classList.remove('btn-primary');
                    mapTypeBaseBtn.classList.add('btn-secondary');
                }
                if (mapTypeSatBtn) {
                    mapTypeSatBtn.classList.remove('btn-secondary');
                    mapTypeSatBtn.classList.add('btn-primary');
                }
            } else {
                if (map.hasLayer(satelliteTileLayer)) map.removeLayer(satelliteTileLayer);
                if (!map.hasLayer(baseTileLayer)) map.addLayer(baseTileLayer);

                if (mapTypeBaseBtn) {
                    mapTypeBaseBtn.classList.remove('btn-secondary');
                    mapTypeBaseBtn.classList.add('btn-primary');
                }
                if (mapTypeSatBtn) {
                    mapTypeSatBtn.classList.remove('btn-primary');
                    mapTypeSatBtn.classList.add('btn-secondary');
                }
            }
        }

        if (mapTypeBaseBtn) mapTypeBaseBtn.addEventListener('click', () => setMapType('base'));
        if (mapTypeSatBtn) mapTypeSatBtn.addEventListener('click', () => setMapType('satellite'));

        const canvasRenderer = L.canvas({ padding: 0.5 });
        const markerLayer = L.layerGroup().addTo(map);
        const markerById = new Map();

        const tableBodyEl = document.getElementById('site-table-body');
        const searchInputEl = document.getElementById('site-search-input');

        let allSites = [];
        let selectedSiteId = null;
        let eventsBound = false;

        const COUNTY_CENTER = {
            '춘천시': [37.8813, 127.7298],
            '원주시': [37.3422, 127.9202],
            '강릉시': [37.7519, 128.8761],
            '동해시': [37.5248, 129.1143],
            '태백시': [37.1641, 128.9855],
            '속초시': [38.2070, 128.5919],
            '삼척시': [37.4499, 129.1650],
            '홍천군': [37.6972, 127.8887],
            '횡성군': [37.4918, 127.9850],
            '영월군': [37.1834, 128.4616],
            '평창군': [37.3703, 128.3900],
            '정선군': [37.3805, 128.6608],
            '철원군': [38.1469, 127.3134],
            '화천군': [38.1069, 127.7089],
            '양구군': [38.1090, 127.9890],
            '인제군': [38.0696, 128.1700],
            '고성군': [38.3806, 128.4678],
            '양양군': [38.0755, 128.6191],
        };

        
        const COASTAL_LNG_GUARD_BY_SIGUNGU = {
      
            '고성군': { scale: 0.55, westShift: 0.04, westMax: 0.16, eastMax: -0.02 },
            '속초시': { scale: 0.55, westShift: 0.04, westMax: 0.10, eastMax: 0.0 },
            '양양군': { scale: 0.55, westShift: 0.04, westMax: 0.10, eastMax: 0.0 },
            '강릉시': { scale: 0.55, westShift: 0.00, westMax: 0.12, eastMax: 0.03 },
            '동해시': { scale: 0.50, westShift: 0.08, westMax: 0.12, eastMax: -0.02 },
            '삼척시': { scale: 0.50, westShift: 0.08, westMax: 0.14, eastMax: -0.02 },
        };

        const EXTRA_WEST_SHIFT_BY_NAME = {
            '강원 고성 거진 송강 N1지구': 0.08,
            '미시령지구': 0.08,
            '미시령2지구': 0.08,

            '강원 동해 비천 N1지구': 0.06,
            '강원 삼척 미로 삼거 N1지구': 0.06,
            '강원 삼척 도계 점 N2지구': 0.06,
            '강원 삼척 도계 점 N3지구': 0.06,
            '강원 삼척 등봉 N2지구': 0.06,
            '영남 동해선 17-2(포삼)': 0.06,
            '영남 동해선 17-6(포삼)': 0.06,
            '강원-영동선135-강': 0.06,
            '동막2지구(지방도427)': 0.06,
            '용연리': 0.06,
            '강원 삼척 미로 사둔 N2지구': 0.06,
        };

        function safeText(el, text) {
            if (!el) return;
            el.textContent = text == null ? '' : String(text);
        }

        function clamp(num, min, max) {
            return Math.max(min, Math.min(max, num));
        }

        function fnv1a32(str) {
            let h = 0x811c9dc5;
            const s = String(str ?? '');
            for (let i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = Math.imul(h, 0x01000193);
            }
            return h >>> 0;
        }

        function hash01(str) {
            // 0..1 (deterministic)
            return (fnv1a32(str) % 1000000) / 1000000;
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        const FALLBACK_GANGWON_ROWS = [
            { '급경사지명': '춘천-방하(샘플)', '시도': '강원특별자치도', '시군구': '춘천시', '읍면동': '남산면', '리': '방하리', '산여부': '산', '주지번': '5', '부지번': '4' },
            { '급경사지명': '강릉-주문진(샘플)', '시도': '강원특별자치도', '시군구': '강릉시', '읍면동': '주문진읍', '리': '', '산여부': '', '주지번': '120', '부지번': '1' },
            { '급경사지명': '원주-흥업(샘플)', '시도': '강원특별자치도', '시군구': '원주시', '읍면동': '흥업면', '리': '', '산여부': '', '주지번': '88', '부지번': '2' },
            { '급경사지명': '속초-대포(샘플)', '시도': '강원특별자치도', '시군구': '속초시', '읍면동': '대포동', '리': '', '산여부': '', '주지번': '33', '부지번': '' },
            { '급경사지명': '정선-봉양(샘플)', '시도': '강원특별자치도', '시군구': '정선군', '읍면동': '정선읍', '리': '봉양리', '산여부': '', '주지번': '430', '부지번': '' },
        ];

        let slopeRowsCache = null;
        let slopeRowsSourceLabel = null;

        async function loadSlopeRows(options = {}) {
            const force = options && options.force === true;
            if (slopeRowsCache && !force) {
                return { rows: slopeRowsCache, sourceLabel: slopeRowsSourceLabel || '내장 데이터 캐시' };
            }

            const embedded = Array.isArray(EMBEDDED_SLOPE_ROWS) ? EMBEDDED_SLOPE_ROWS : [];
            if (embedded.length) {
                slopeRowsCache = embedded;
                slopeRowsSourceLabel = '내장 데이터 (m1_embedded_slope_rows.js)';
                return { rows: slopeRowsCache, sourceLabel: slopeRowsSourceLabel };
            }

            // 내장 데이터가 비어있으면 최소 샘플로 fallback
            slopeRowsCache = FALLBACK_GANGWON_ROWS;
            slopeRowsSourceLabel = '내장 샘플(최소 fallback)';
            return { rows: slopeRowsCache, sourceLabel: slopeRowsSourceLabel, error: new Error('내장 데이터가 비어있습니다.') };
        }

        function gradeInfo(grade5) {
            const g = Number.parseInt(String(grade5 ?? ''), 10);
            if (g === 5) return { label: 'E등급 (심각)', gradeOnly: 'E등급', badgeClass: 'badge-danger', color: '#EF4444', status: '경보 발령 중', statusClass: 'text-rose-600' };
            if (g === 4) return { label: 'D등급 (경계)', gradeOnly: 'D등급', badgeClass: 'badge-warning', color: '#F59E0B', status: '변위 감지', statusClass: 'text-amber-700' };
            if (g === 3) return { label: 'C등급 (주의)', gradeOnly: 'C등급', badgeClass: 'badge-warning', color: '#FCD34D', status: '주의 관찰', statusClass: 'text-yellow-700' };
            if (g === 2) return { label: 'B등급 (관심)', gradeOnly: 'B등급', badgeClass: 'badge-info', color: '#3B82F6', status: '관심', statusClass: 'text-sky-700' };
            if (g === 1) return { label: 'A등급 (안전)', gradeOnly: 'A등급', badgeClass: 'badge-success', color: '#10B981', status: '모니터링', statusClass: 'text-slate-600' };
            return { label: '등급 미상', gradeOnly: '등급 미상', badgeClass: 'badge-info', color: '#64748B', status: '모니터링', statusClass: 'text-slate-600' };
        }

        function buildAddress(r) {
            const sido = (r['시도'] || '').trim();
            const sigungu = (r['시군구'] || '').trim();
            const eup = (r['읍면동'] || '').trim();
            const ri = (r['리'] || '').trim();
            const isMt = (r['산여부'] || '').trim();
            const main = (r['주지번'] || '').trim();
            const sub = (r['부지번'] || '').trim();
            const jibun = main ? (sub ? `${main}-${sub}` : `${main}`) : '';
            const mt = isMt ? `${isMt} ` : '';
            const parts = [sido, sigungu, eup, ri].filter(Boolean);
            return `${parts.join(' ')} ${mt}${jibun}`.trim();
        }

        function rowKey(r) {
            return [
                (r['시도'] || '').trim(),
                (r['시군구'] || '').trim(),
                (r['읍면동'] || '').trim(),
                (r['리'] || '').trim(),
                (r['산여부'] || '').trim(),
                (r['주지번'] || '').trim(),
                (r['부지번'] || '').trim(),
                (r['급경사지명'] || '').trim(),
            ].join('|');
        }

        function pickSample(rows, limit) {
            const withScore = (rows || []).map((r) => ({ r, score: fnv1a32(rowKey(r)) }));
            withScore.sort((a, b) => a.score - b.score);
            return withScore.slice(0, Math.max(0, limit || 0)).map((x) => x.r);
        }

        function deriveGrade5(seed) {
            const x = hash01(seed);
            if (x < 0.52) return 1; // A
            if (x < 0.74) return 2; // B
            if (x < 0.88) return 3; // C
            if (x < 0.96) return 4; // D
            return 5; // E
        }

        function formatDateYYYYMMDD(d) {
            const yy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;
        }

        function deriveLastCheck(grade5, seed) {
            const base = grade5 === 5 ? 7 : grade5 === 4 ? 14 : grade5 === 3 ? 30 : grade5 === 2 ? 60 : 90;
            const jitter = Math.floor(hash01(seed + '|lastCheck') * base);
            const daysAgo = base + jitter;
            const d = new Date();
            d.setDate(d.getDate() - daysAgo);
            return formatDateYYYYMMDD(d);
        }

        function deriveLatLng(r, seed) {
            const sigungu = (r['시군구'] || '').trim();
            const eupmyeondong = (r['읍면동'] || '').trim();
            const ri = (r['리'] || '').trim();
            const name = (r['급경사지명'] || '').trim();
            const base = COUNTY_CENTER[sigungu] || GANGWON_CENTER;

            // (1) 시군구 중심점 + (2) 읍면동/리 단위의 "근처 클러스터" + (3) 개별 지점 소폭 분산 으로 좌표를 추정합니다.
            // ※ 지오코딩(주소→좌표) 추후 API 연동을 붙일 수 있습니다.
            const areaKey = `${sigungu}|${eupmyeondong}|${ri}`;

            // 읍면동/리 단위 분산(동네끼리 모이도록)
            const areaLatJ = (hash01(areaKey + '|areaLat') - 0.5) * 0.18;
            const areaLngJ = (hash01(areaKey + '|areaLng') - 0.5) * 0.28;

            // 개별 지점 분산(겹침 완화)
            const pointLatJ = (hash01(seed + '|lat') - 0.5) * 0.04;
            const pointLngJ = (hash01(seed + '|lng') - 0.5) * 0.06;

            const lat = clamp(base[0] + areaLatJ + pointLatJ, GANGWON_SW[0], GANGWON_NE[0]);
            let lng = base[1] + areaLngJ + pointLngJ;

            const guard = COASTAL_LNG_GUARD_BY_SIGUNGU[sigungu];
            if (guard) {
                const scaled = (areaLngJ + pointLngJ) * (typeof guard.scale === 'number' ? guard.scale : 0.55);
                const westShift = typeof guard.westShift === 'number' ? guard.westShift : 0.04;
                lng = base[1] + scaled - westShift;

                const westMax = typeof guard.westMax === 'number' ? guard.westMax : 0.12;
                const eastMax = typeof guard.eastMax === 'number' ? guard.eastMax : 0.0;
                lng = clamp(lng, base[1] - westMax, base[1] + eastMax);
            }

            const extraWest = EXTRA_WEST_SHIFT_BY_NAME[name];
            if (typeof extraWest === 'number' && Number.isFinite(extraWest)) {
                lng = lng - extraWest;
            }

            // 전체 범위 클램프
            lng = clamp(lng, GANGWON_SW[1], GANGWON_NE[1]);
            return { lat, lng };
        }

        function buildSite(r) {
            const seed = rowKey(r);
            const id = `gw_${fnv1a32(seed).toString(36)}`;
            const address = buildAddress(r);
            const { lat, lng } = deriveLatLng(r, seed);
            const grade5 = deriveGrade5(seed);
            const g = gradeInfo(grade5);
            const lastCheck = deriveLastCheck(grade5, seed);

            return {
                id,
                name: (r['급경사지명'] || '').trim() || '급경사지',
                sido: (r['시도'] || '').trim(),
                sigungu: (r['시군구'] || '').trim(),
                eupmyeondong: (r['읍면동'] || '').trim(),
                ri: (r['리'] || '').trim(),
                isMountain: (r['산여부'] || '').trim(),
                mainJibun: (r['주지번'] || '').trim(),
                subJibun: (r['부지번'] || '').trim(),
                address,
                lat,
                lng,
                grade5,
                gradeLabel: g.gradeOnly,
                badgeClass: g.badgeClass,
                markerColor: g.color,
                statusText: g.status,
                statusClass: g.statusClass,
                lastCheck,
            };
        }

        function clearMarkers() {
            markerLayer.clearLayers();
            markerById.clear();
        }

        function addMarkers(sites) {
            clearMarkers();

            (sites || []).forEach((site) => {
                const marker = L.circleMarker([site.lat, site.lng], {
                    radius: 7,
                    fillColor: site.markerColor,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.85,
                    renderer: canvasRenderer,
                });

                const popupHtml = [
                    `<div style="min-width: 220px;">`,
                    `<div style="font-weight: 700; margin-bottom: 4px;">${escapeHtml(site.name)}</div>`,
                    `<div style="font-size: 12px; color: #475569; margin-bottom: 6px;">${escapeHtml(site.address)}</div>`,
                    `<div style="display:flex; align-items:center; gap:8px; font-size:12px;">`,
                    `<span style="display:inline-block; width:10px; height:10px; border-radius:999px; background:${escapeHtml(site.markerColor)};"></span>`,
                    `<span>${escapeHtml(gradeInfo(site.grade5).label)}</span>`,
                    `</div>`,
                    `</div>`,
                ].join('');

                marker.bindPopup(popupHtml);
                marker.on('click', () => {
                    selectedSiteId = site.id;
                    renderTable();
                });

                marker.addTo(markerLayer);
                markerById.set(site.id, marker);
            });
        }

        function focusSite(siteId) {
            const site = allSites.find((s) => s.id === siteId);
            if (!site) return;
            selectedSiteId = siteId;

            map.setView([site.lat, site.lng], Math.max(map.getZoom(), 12), { animate: true });
            const m = markerById.get(siteId);
            if (m) m.openPopup();
            renderTable();
        }

        function matchesQuery(site, query) {
            const q = String(query || '').trim().toLowerCase();
            if (!q) return true;
            const hay = [
                site.name,
                site.address,
                site.sigungu,
                site.eupmyeondong,
                site.ri,
            ].join(' ').toLowerCase();
            return hay.includes(q);
        }

        function renderTable() {
            if (!tableBodyEl) return;

            const bounds = map.getBounds();
            const query = searchInputEl ? (searchInputEl.value || '') : '';

            // 1) 지도 bounds 안에 있는 항목만
            let visible = (allSites || []).filter((s) => bounds.contains([s.lat, s.lng]));

            // 2) 검색어 적용
            visible = visible.filter((s) => matchesQuery(s, query));

            // 3) 위험도(등급) 높은 순 + 지역명 정렬
            visible.sort((a, b) => {
                const dg = (b.grade5 || 0) - (a.grade5 || 0);
                if (dg !== 0) return dg;
                const sa = (a.sigungu || '').localeCompare((b.sigungu || ''), 'ko');
                if (sa !== 0) return sa;
                return (a.name || '').localeCompare((b.name || ''), 'ko');
            });

            tableBodyEl.innerHTML = '';

            if (!visible.length) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 7;
                td.className = 'text-center text-slate-500 py-10';
                td.textContent = '현재 지도 화면에서 조건에 맞는 급경사지가 없습니다.';
                tr.appendChild(td);
                tableBodyEl.appendChild(tr);
                return;
            }

            visible.forEach((site, idx) => {
                const tr = document.createElement('tr');
                if (site.id === selectedSiteId) tr.classList.add('site-row-selected');

                tr.addEventListener('click', () => focusSite(site.id));

                const tdNo = document.createElement('td');
                tdNo.textContent = String(idx + 1);

                const tdName = document.createElement('td');
                tdName.style.fontWeight = '600';
                tdName.textContent = `${site.sigungu} ${site.eupmyeondong}`.trim() ? `${site.sigungu} ${site.eupmyeondong} · ${site.name}` : site.name;

                const tdAddr = document.createElement('td');
                tdAddr.textContent = site.address || '-';

                const tdGrade = document.createElement('td');
                const badge = document.createElement('span');
                badge.className = `badge ${site.badgeClass || 'badge-info'}`;
                badge.textContent = site.gradeLabel || '등급 미상';
                tdGrade.appendChild(badge);

                const tdLast = document.createElement('td');
                tdLast.textContent = site.lastCheck || '-';

                const tdStatus = document.createElement('td');
                tdStatus.className = `font-medium ${site.statusClass || 'text-slate-600'}`;
                tdStatus.textContent = site.statusText || '모니터링';

                const tdAction = document.createElement('td');
                const a = document.createElement('a');
                a.href = `mn1_detail.html?site=${encodeURIComponent(site.id)}`;
                a.className = 'btn btn-secondary btn-sm';
                a.textContent = '상세';
                a.addEventListener('click', () => {
                    try {
                        localStorage.setItem('m1_integrated_selected_site_v1', JSON.stringify(site));
                        localStorage.setItem('m1_integrated_sites_cache_v1', JSON.stringify(allSites));
                    } catch {
                        // ignore
                    }
                });
                tdAction.appendChild(a);

                tr.appendChild(tdNo);
                tr.appendChild(tdName);
                tr.appendChild(tdAddr);
                tr.appendChild(tdGrade);
                tr.appendChild(tdLast);
                tr.appendChild(tdStatus);
                tr.appendChild(tdAction);

                tableBodyEl.appendChild(tr);
            });
        }

        function bindEventsOnce() {
            if (eventsBound) return;
            eventsBound = true;

            // 이벤트: 지도 이동/줌 → 현재 화면에 보이는 것만 목록 표시
            map.on('moveend', () => renderTable());

            // 이벤트: 검색
            if (searchInputEl) {
                searchInputEl.addEventListener('input', () => renderTable());
            }
        }

        function applySlopeRows(rows, sourceLabel, error) {
            const gangwonRows = (rows || []).filter((r) => String(r['시도'] || '').includes('강원'));
            const sampled = pickSample(gangwonRows, SAMPLE_LIMIT);

            allSites = sampled.map(buildSite);

            // detail 페이지에서 재사용 가능하도록 캐시 (옵션)
            try {
                localStorage.setItem('m1_integrated_sites_cache_v1', JSON.stringify(allSites));
            } catch {
                // ignore
            }

            addMarkers(allSites);
            renderTable();
        }

        async function init() {
            if (tableBodyEl) {
                tableBodyEl.innerHTML = `<tr><td colspan="7" class="text-center text-slate-500 py-10">데이터 로딩 중…</td></tr>`;
            }

            bindEventsOnce();

            const { rows, sourceLabel, error } = await loadSlopeRows({ force: true });
            applySlopeRows(rows, sourceLabel, error);
        }

        init();
    </script>
