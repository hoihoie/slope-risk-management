<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 급경사지 안전관리 통합시스템</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'Noto Sans KR', 'Malgun Gothic', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        soft: '0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.08)',
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        @layer base {
            html { @apply antialiased; }
            body { @apply bg-slate-50 text-slate-900 font-sans; }
        }

        @layer components {
            .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-semibold transition focus:outline-none focus:ring-2 focus:ring-sky-500/30 disabled:opacity-50 disabled:pointer-events-none; }
            .btn-primary { @apply bg-sky-100 text-sky-900 ring-1 ring-inset ring-sky-200 hover:bg-sky-200; }
            .role-button { @apply rounded-lg border px-3 py-2 text-sm font-semibold transition; }
            .role-button.active { @apply border-sky-300 bg-sky-100 text-sky-900 ring-1 ring-sky-200; }
            .role-button.inactive { @apply border-slate-200 bg-white text-slate-600 hover:bg-slate-50; }
            .field { @apply mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20; }
        }
    </style>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-lg rounded-none bg-white p-10 shadow-lg ring-1 ring-slate-200">
        <div class="text-center">
            <img src="assets/images/orbital_newlogo.png" alt="Orbital Logo" class="mx-auto h-12 w-auto opacity-95">
            <h1 class="mt-4 text-xl font-semibold tracking-tight text-slate-900">
                급경사지 안전관리<br>
                Orbital 통합관제시스템
            </h1>
            <p class="mt-2 text-sm text-slate-600">소속 유형에 맞는 로그인으로 대시보드 화면을 구분합니다.</p>
        </div>

        <form class="login-form mt-8 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700">로그인 유형</label>
                <div class="mt-2 grid grid-cols-2 gap-2">
                    <button type="button" class="role-button active" data-role="mois">행정안전부 소속</button>
                    <button type="button" class="role-button inactive" data-role="local">지자체 소속</button>
                </div>
            </div>

            <div id="regionField" class="hidden">
                <label class="block text-xs font-semibold text-slate-700">지자체 지역 선택</label>
                <select id="region" class="field">
                    <option value="">지역을 선택하세요</option>
                    <option value="강원특별자치도 정선군">강원특별자치도 정선군</option>
                    <option value="강원특별자치도 삼척시">강원특별자치도 삼척시</option>
                    <option value="경상북도 울진군">경상북도 울진군</option>
                    <option value="전라남도 순천시">전라남도 순천시</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700">아이디</label>
                <input type="text" id="userid" placeholder="아이디를 입력하세요" required class="field">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700">비밀번호</label>
                <input type="password" id="userpw" placeholder="비밀번호를 입력하세요" required class="field">
            </div>

            <div class="rounded-lg bg-slate-50 p-3 text-xs text-slate-600 ring-1 ring-slate-200">
                <p class="font-semibold text-slate-700">테스트 계정</p>
                <p class="mt-1">행정안전부: <code>mois / mois1234</code></p>
                <p>지자체 관리자: <code>local / local1234</code></p>
                <p>운영 관리자: <code>4321 / 4321</code></p>
            </div>

            <button type="submit" class="btn btn-primary w-full">로그인</button>
        </form>

        <div class="mt-8 border-t border-slate-200 pt-6 text-center text-xs text-slate-500">
            <p><strong>문의</strong> 정선군청 건설과 033-XXX-XXXX</p>
        </div>
    </div>

    <script>
        const roleButtons = document.querySelectorAll('.role-button');
        const regionField = document.getElementById('regionField');
        let selectedRole = 'mois';

        function updateRole(role) {
            selectedRole = role;
            roleButtons.forEach(button => {
                const isActive = button.dataset.role === role;
                button.classList.toggle('active', isActive);
                button.classList.toggle('inactive', !isActive);
            });
            regionField.classList.toggle('hidden', role !== 'local');
        }

        roleButtons.forEach(button => {
            button.addEventListener('click', () => updateRole(button.dataset.role));
        });

        document.querySelector('.login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const id = document.getElementById('userid').value;
            const pw = document.getElementById('userpw').value;
            const region = document.getElementById('region').value;

            if (id === '4321' && pw === '4321') {
                window.location.href = 'admin_dashboard.html';
                return;
            }

            if (selectedRole === 'mois' && id === 'mois' && pw === 'mois1234') {
                window.location.href = 'mois_dashboard.html';
                return;
            }

            if (selectedRole === 'local' && id === 'local' && pw === 'local1234') {
                if (!region) {
                    alert('지자체 소속 로그인의 경우 지역 선택이 필요합니다.');
                    return;
                }
                window.location.href = 'local_dashboard.html';
                return;
            }

            alert('아이디 또는 비밀번호가 일치하지 않습니다. 로그인 유형과 테스트 계정을 확인하세요.');
        });
    </script>
</body>

</html>
