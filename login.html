<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 급경사지 안전관리 통합시스템</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'Noto Sans KR', 'Malgun Gothic', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        soft: '0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.08)',
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        @layer base {
            html { @apply antialiased; }
            body { @apply bg-slate-50 text-slate-900 font-sans; }
        }

        @layer components {
            .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-semibold transition focus:outline-none focus:ring-2 focus:ring-sky-500/30 disabled:opacity-50 disabled:pointer-events-none; }
            .btn-primary { @apply bg-sky-100 text-sky-900 ring-1 ring-inset ring-sky-200 hover:bg-sky-200; }
        }
    </style>
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-lg rounded-none bg-white p-10 shadow-lg ring-1 ring-slate-200">
        <div class="text-center">
            <!-- 로고 이미지 적용 -->
            <img src="assets/images/orbital_newlogo.png" alt="Orbital Logo" class="mx-auto h-12 w-auto opacity-95">
            <h1 class="mt-4 text-xl font-semibold tracking-tight text-slate-900">
                급경사지 안전관리<br>
                Orbital 통합관제시스템
            </h1>
        </div>

        <form class="login-form mt-8 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700">소속 구분</label>
                <div class="mt-2 grid grid-cols-2 gap-2 rounded-lg bg-slate-100 p-1">
                    <label
                        class="role-option flex cursor-pointer items-center justify-center rounded-md border border-transparent bg-white px-3 py-2 text-sm font-semibold text-sky-800 ring-1 ring-sky-200">
                        <input type="radio" name="affiliation" value="mois" checked class="sr-only">
                        행정안전부
                    </label>
                    <label
                        class="role-option flex cursor-pointer items-center justify-center rounded-md border border-transparent px-3 py-2 text-sm font-semibold text-slate-600">
                        <input type="radio" name="affiliation" value="local" class="sr-only">
                        지자체
                    </label>
                </div>
            </div>

            <div id="region-field" class="hidden">
                <label for="region" class="block text-xs font-semibold text-slate-700">관할 지역</label>
                <select id="region"
                    class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20">
                    <option value="">지역을 선택하세요</option>
                    <option value="강원특별자치도 정선군">강원특별자치도 정선군</option>
                    <option value="강원특별자치도 평창군">강원특별자치도 평창군</option>
                    <option value="강원특별자치도 태백시">강원특별자치도 태백시</option>
                    <option value="강원특별자치도 삼척시">강원특별자치도 삼척시</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700">아이디</label>
                <input type="text" id="userid" placeholder="아이디를 입력하세요" required
                    class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700">비밀번호</label>
                <input type="password" id="userpw" placeholder="비밀번호를 입력하세요" required
                    class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20">
            </div>

            <div class="flex justify-end">
                <a href="#" class="text-sm font-semibold text-sky-700 hover:text-sky-800">비밀번호 찾기</a>
            </div>

            <button type="submit" class="btn btn-primary w-full">
                로그인
            </button>
        </form>

        <div class="mt-8 border-t border-slate-200 pt-6 text-center text-xs text-slate-500">

        </div>
    </div>

    <script>
        const roleOptions = Array.from(document.querySelectorAll('.role-option'));
        const affiliationInputs = Array.from(document.querySelectorAll('input[name="affiliation"]'));
        const regionField = document.getElementById('region-field');
        const regionSelect = document.getElementById('region');

        function getAffiliation() {
            const selected = affiliationInputs.find((input) => input.checked);
            return selected ? selected.value : 'mois';
        }

        function renderAffiliationUI() {
            const affiliation = getAffiliation();
            roleOptions.forEach((option) => {
                const input = option.querySelector('input[name="affiliation"]');
                const isActive = input && input.checked;
                option.classList.toggle('bg-white', isActive);
                option.classList.toggle('text-sky-800', isActive);
                option.classList.toggle('ring-1', isActive);
                option.classList.toggle('ring-sky-200', isActive);
                option.classList.toggle('text-slate-600', !isActive);
            });

            const isLocal = affiliation === 'local';
            regionField.classList.toggle('hidden', !isLocal);
            if (!isLocal) {
                regionSelect.value = '';
            }
        }

        affiliationInputs.forEach((input) => {
            input.addEventListener('change', renderAffiliationUI);
        });
        renderAffiliationUI();

        document.querySelector('.login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const id = document.getElementById('userid').value.trim();
            const pw = document.getElementById('userpw').value.trim();
            const affiliation = getAffiliation();
            const region = regionSelect.value;

            // IT 운영자 계정: 4321 / 4321 -> Admin 대시보드
            if (id === '4321' && pw === '4321') {
                try {
                    localStorage.setItem('dashboard_role_v1', 'admin');
                    localStorage.removeItem('dashboard_region_v1');
                } catch {
                    // ignore
                }
                window.location.href = 'admin_dashboard.html';
                return;
            }

            // 행안부 소속 계정: mois / 1234 또는 1234 / 1234
            if (affiliation === 'mois' && ((id === 'mois' && pw === '1234') || (id === '1234' && pw === '1234'))) {
                try {
                    localStorage.setItem('dashboard_role_v1', 'mois');
                    localStorage.removeItem('dashboard_region_v1');
                } catch {
                    // ignore
                }
                window.location.href = 'dashboard_mois.html';
                return;
            }

            // 지자체 소속 계정: local / 1234 또는 1234 / 1234 + 지역 필수
            if (affiliation === 'local' && ((id === 'local' && pw === '1234') || (id === '1234' && pw === '1234'))) {
                if (!region) {
                    alert('지자체 소속 로그인은 관할 지역 선택이 필요합니다.');
                    return;
                }
                try {
                    localStorage.setItem('dashboard_role_v1', 'local');
                    localStorage.setItem('dashboard_region_v1', region);
                } catch {
                    // ignore
                }
                window.location.href = `dashboard.html?region=${encodeURIComponent(region)}`;
                return;
            }

            alert(
                '아이디 또는 비밀번호가 일치하지 않습니다.\n\n[테스트 계정]\n• 행정안전부: mois / 1234\n• 지자체: local / 1234 (지역 선택 필수)\n• IT 운영자: 4321 / 4321'
            );
        });
    </script>
</body>

</html>
